<div class="gm" id="gm">
  <div class="gm-modes" role="tablist" aria-label="Game mode">
    <button type="button" role="tab" data-mode="daily" aria-selected="true"><b>Daily 10</b><small>Same 10 films for everyone</small></button>
    <button type="button" role="tab" data-mode="endless" aria-selected="false"><b>Endless</b><small>Keep going until you miss</small></button>
  </div>
  <div class="gm-top">
    <div class="gm-title"><b data-no>#1</b><span data-date></span></div>
    <div class="gm-tools">
      <span class="gm-streak" data-streak title="Current streak"><i aria-hidden="true">🔥</i><b>0</b></span>
      <button type="button" class="gm-ico" data-open="archive" aria-label="Past puzzles"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></button>
      <button type="button" class="gm-ico" data-open="stats" aria-label="Statistics"><svg viewBox="0 0 24 24"><path d="M5 20V11M12 20V5M19 20v-6"/></svg></button>
      <button type="button" class="gm-ico" data-open="help" aria-label="How to play"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.3a2.5 2.5 0 1 1 3.4 2.4c-.7.3-1 .8-1 1.5v.3M12 16.6v.4"/></svg></button>
    </div>
  </div>

  <div class="gm-set" data-set aria-label="Today’s films"></div>
  <div class="gm-hud" data-hud hidden>
    <div class="gm-diff" data-diffs>
      <button type="button" data-diff="easy" aria-pressed="true">Easy</button>
      <button type="button" data-diff="medium" aria-pressed="false">Medium</button>
      <button type="button" data-diff="buff" aria-pressed="false">Film buff</button>
    </div>
    <div class="gm-run"><span>Run <b data-run>0</b></span><span>Best <b data-best>0</b></span></div>
  </div>

  <div class="gm-stage" data-stage>
    <div class="gm-glow" aria-hidden="true"></div>
    <div class="gm-emoji" data-emoji aria-live="polite"></div>
    <div class="gm-ladder" data-ladder aria-hidden="true"></div>
    <div class="gm-poster" data-poster hidden><div class="gm-flip"><div class="gm-face front">?</div><div class="gm-face back" data-poster-back></div></div></div>
  </div>

  <ol class="gm-clues" data-clues></ol>

  <div class="gm-play" data-play>
    <form class="gm-form" data-form autocomplete="off">
      <div class="gm-input">
        <input type="text" data-guess placeholder="Type a film title…" aria-label="Your guess" aria-autocomplete="list" aria-controls="gm-sug" spellcheck="false" enterkeyhint="go">
        <ul id="gm-sug" class="gm-sug" data-sug role="listbox" hidden></ul>
      </div>
      <button type="submit" class="gm-go">Guess</button>
    </form>
    <div class="gm-under"><span data-left>6 guesses left</span><button type="button" class="gm-skip" data-skip>Skip, show the next clue →</button></div>
  </div>
  <ul class="gm-guesses" data-guesses></ul>

  <div class="gm-result" data-result hidden></div>

  <div class="gm-modal" data-modal hidden role="dialog" aria-modal="true" aria-labelledby="gm-mt">
    <div class="gm-back" data-close></div>
    <div class="gm-sheet"><button type="button" class="gm-x" data-close aria-label="Close">×</button><div data-modal-body></div></div>
  </div>
  <canvas class="gm-confetti" data-confetti aria-hidden="true"></canvas>
</div>
