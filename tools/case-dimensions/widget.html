<div class="cd" id="cd">
  <div class="cd-in">
    <div class="cd-row-h"><h2 class="cd-h">Pick a case</h2>
      <div class="cd-units" role="radiogroup" aria-label="Units"><button type="button" data-unit="in" aria-pressed="false">inches</button><button type="button" data-unit="mm" aria-pressed="false">mm</button></div></div>
    <div class="cd-cases" data-cases></div>
    <div class="cd-viz" data-viz aria-hidden="false"></div>
  </div>
  <div class="cd-out" aria-live="polite">
    <span class="eyebrow"><i></i><span data-name>Blu-ray case dimensions</span></span>
    <p class="cd-big" data-big>171.5 × 135 × 12 mm</p>
    <p class="cd-alt" data-alt>6.75 × 5.31 × 0.47 in · height × width × thickness</p>
    <table class="cd-tbl"><tbody data-rows></tbody></table>
    <p class="cd-note">Sizes are for standard retail cases. A few studios and countries use slightly thicker cases, so measure the spine if you're matching a cracked case.</p>
    <div class="cd-act">
      <button type="button" class="cd-copy" data-copy>Copy dimensions</button>
      <a class="btn btn-accent" href="https://apps.apple.com/us/app/movieshelf-media-organizer/id6760224869?ct=tool-case-dimensions&amp;mt=8" target="_blank" rel="noopener">Catalog your discs in Movieshelf</a>
    </div>
  </div>
</div>
