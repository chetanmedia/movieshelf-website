<div class="cm" id="cm">
  <div class="cm-stage">
    <div class="cm-view" role="tablist" aria-label="Preview">
      <button type="button" role="tab" data-view="flat" aria-selected="true">Print layout</button>
      <button type="button" role="tab" data-view="case" aria-selected="false">3D case</button>
      <label class="cm-guides"><input type="checkbox" data-k="guides" checked> Guides</label>
    </div>
    <div class="cm-canvas-wrap" data-flat>
      <canvas class="cm-canvas" data-canvas aria-label="Cover print layout preview"></canvas>
      <p class="cm-drag-tip">Drag an image on the cover to move it</p>
    </div>
    <div class="cm-case-wrap" data-case hidden>
      <div class="cm-case" data-case3d><div class="cm-face front" data-face-front></div><div class="cm-face spine" data-face-spine></div><div class="cm-face back" data-face-back></div><div class="cm-face edge" data-face-edge></div></div>
      <p class="cm-drag-tip">Drag to turn the case</p>
    </div>
    <p class="cm-size" data-size></p>
    <div class="cm-export">
      <button type="button" class="btn btn-accent" data-export="pdf-exact">Download PDF</button>
      <div class="cm-export-more">
        <button type="button" class="cm-btn" data-export="pdf-page">PDF on <span data-paper>Letter</span> with crop marks</button>
        <button type="button" class="cm-btn" data-export="png">PNG, 300 dpi</button>
      </div>
      <p class="cm-privacy">Your images never leave your device. Everything is made in your browser.</p>
    </div>
  </div>

  <div class="cm-panel">
    <div class="cm-tabs" role="tablist" aria-label="Edit">
      <button type="button" role="tab" data-tab="case" aria-selected="true">Case</button>
      <button type="button" role="tab" data-tab="front" aria-selected="false">Front</button>
      <button type="button" role="tab" data-tab="spine" aria-selected="false">Spine</button>
      <button type="button" role="tab" data-tab="back" aria-selected="false">Back</button>
    </div>

    <section class="cm-sec" data-sec="case">
      <h3>Case type</h3>
      <div class="cm-tpls" data-tpls></div>
      <label class="cm-row"><span>Spine width<small>Measure your case if unsure</small></span><span class="cm-num"><input type="number" step="0.5" min="5" max="40" data-k="spine" inputmode="decimal"><em>mm</em></span></label>
      <label class="cm-row"><span>Paper for home printing</span><select data-k="paper"><option value="letter">US Letter</option><option value="a4">A4</option></select></label>
      <button type="button" class="cm-reset" data-reset>Start over with the sample cover</button>
    </section>

    <section class="cm-sec" data-sec="front" hidden>
      <h3>Front artwork</h3>
      <label class="cm-drop" data-drop="front"><input type="file" accept="image/*" data-file="front"><b>Choose an image</b><span>or drop it here. JPG or PNG, ideally 1500 px wide or more.</span></label>
      <label class="cm-row"><span>Zoom</span><input type="range" min="1" max="3" step="0.01" data-k="f.zoom"></label>
      <div class="cm-two">
        <label class="cm-row"><span>Move sideways</span><input type="range" min="-1" max="1" step="0.01" data-k="f.x"></label>
        <label class="cm-row"><span>Move up/down</span><input type="range" min="-1" max="1" step="0.01" data-k="f.y"></label>
      </div>
      <h3>Title on the front</h3>
      <label class="cm-row"><span>Title</span><input type="text" maxlength="60" data-k="f.title" placeholder="Leave empty for none"></label>
      <div class="cm-two">
        <label class="cm-row"><span>Font</span><select data-k="f.font" data-fonts></select></label>
        <label class="cm-row"><span>Colour</span><input type="color" data-k="f.color"></label>
      </div>
      <div class="cm-two">
        <label class="cm-row"><span>Size</span><input type="range" min="6" max="30" step="0.5" data-k="f.size"></label>
        <label class="cm-row"><span>Position</span><select data-k="f.pos"><option value="top">Top</option><option value="middle">Middle</option><option value="bottom">Bottom</option></select></label>
      </div>
      <label class="cm-check"><input type="checkbox" data-k="f.banner"> Top banner</label>
      <div class="cm-two">
        <label class="cm-row"><span>Banner text</span><input type="text" maxlength="40" data-k="f.bannerText"></label>
        <label class="cm-row"><span>Banner colour</span><input type="color" data-k="f.bannerColor"></label>
      </div>
    </section>

    <section class="cm-sec" data-sec="spine" hidden>
      <h3>Spine</h3>
      <label class="cm-row"><span>Spine title</span><input type="text" maxlength="60" data-k="s.title"></label>
      <div class="cm-two">
        <label class="cm-row"><span>Font</span><select data-k="s.font" data-fonts></select></label>
        <label class="cm-row"><span>Text colour</span><input type="color" data-k="s.color"></label>
      </div>
      <label class="cm-row"><span>Collector number<small>For example 042. Leave empty for none.</small></span><input type="text" maxlength="6" data-k="s.num"></label>
      <label class="cm-drop small" data-drop="spine"><input type="file" accept="image/*" data-file="spine"><b>Add a spine image</b><span>A tall, narrow image works best</span></label>
      <label class="cm-row"><span>Background</span><select data-k="s.bg"><option value="auto">Match the front artwork</option><option value="color">Solid colour</option><option value="image">My spine image</option></select></label>
      <label class="cm-row" data-show-if="s.bg=color"><span>Spine colour</span><input type="color" data-k="s.bgColor"></label>
      <div class="cm-imgctl" data-show-if="s.bg=image">
        <label class="cm-row"><span>Zoom</span><input type="range" min="1" max="3" step="0.01" data-k="s.zoom"></label>
        <label class="cm-row"><span>Move up/down</span><input type="range" min="-1" max="1" step="0.01" data-k="s.y"></label>
        <button type="button" class="cm-reset" data-remove="spine">Remove spine image</button>
      </div>
      <label class="cm-row"><span>Text reads</span><select data-k="s.dir"><option value="down">Top to bottom (US style)</option><option value="up">Bottom to top (UK and Europe)</option></select></label>
    </section>

    <section class="cm-sec" data-sec="back" hidden>
      <h3>Back</h3>
      <label class="cm-drop small" data-drop="back"><input type="file" accept="image/*" data-file="back"><b>Add a back image</b><span>or drop it here</span></label>
      <label class="cm-row"><span>Background</span><select data-k="b.bg"><option value="blur">Blurred front artwork</option><option value="color">Solid colour</option><option value="image">My back image</option></select></label>
      <label class="cm-row" data-show-if="b.bg=color"><span>Colour</span><input type="color" data-k="b.bgColor"></label>
      <div class="cm-imgctl" data-show-if="b.bg=image">
        <label class="cm-row"><span>Zoom</span><input type="range" min="1" max="3" step="0.01" data-k="b.zoom"></label>
        <div class="cm-two">
          <label class="cm-row"><span>Move sideways</span><input type="range" min="-1" max="1" step="0.01" data-k="b.x"></label>
          <label class="cm-row"><span>Move up/down</span><input type="range" min="-1" max="1" step="0.01" data-k="b.y"></label>
        </div>
        <label class="cm-check"><input type="checkbox" data-k="b.dim"> Darken it so the text stays readable</label>
        <button type="button" class="cm-reset" data-remove="back">Remove back image</button>
      </div>
      <label class="cm-row"><span>Tagline</span><input type="text" maxlength="80" data-k="b.tagline"></label>
      <label class="cm-row"><span>Synopsis</span><textarea rows="5" maxlength="900" data-k="b.body"></textarea></label>
      <div class="cm-two">
        <label class="cm-row"><span>Font</span><select data-k="b.font" data-fonts></select></label>
        <label class="cm-row"><span>Text colour</span><input type="color" data-k="b.color"></label>
      </div>
      <label class="cm-row"><span>Small print<small>Runtime, audio, your own notes</small></span><input type="text" maxlength="120" data-k="b.small"></label>
    </section>
    <p class="cm-legal">Use your own photos or artwork you have the rights to. Covers are for your personal collection.</p>
  </div>
</div>
