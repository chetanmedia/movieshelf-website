[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Pings IndexNow (Bing/ChatGPT search, Yandex…) and Google's WebSub hub after each live deploy.
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Keeps the TMDB film data between builds (see scripts/tmdb.mjs).
[[plugins]]
  package = "/netlify/plugins/tmdb-cache"

[[plugins]]
  package = "/netlify/plugins/instant-indexing"
